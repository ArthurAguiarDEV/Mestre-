           "entrar", "entra no", "carrega", "quero ver", "quero assistir", "me mostra",
           "vai no", "vai na", "vai pro", "vai pra", "me leva pro", "me leva pra",
           "me abre", "me bota", "me coloca", "me mostrar", "mostrar",

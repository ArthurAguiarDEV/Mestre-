# =====================================================================
#  VOCABULARIO DO MESTRE  (a "base de variaveis")
#
#  Aqui voce ensina ao Mestre os VARIOS JEITOS de falar a mesma coisa.
#  Ele "traduz" o que voce falou para a forma que ele conhece, e so depois
#  procura o comando. Assim voce nao precisa decorar frases.
#
#  Exemplo: "po, mestre, bota ai o youtube pra mim"
#     1. tira os enfeites  ->  "bota o youtube"
#     2. troca sinonimos   ->  "abre o youtube"
#     3. executa           ->  abre o YouTube
#
#  Mesmas regras do config.yaml: sem TAB, textos entre aspas, sem acentos
#  (o Mestre ignora acentos, entao "voce" e "você" sao iguais).
#  O que voce ensinar POR VOZ fica em aprendido.yaml (nao precisa mexer).
# =====================================================================


# ---------------------------------------------------------------------
# 1) ENFEITES NO COMECO da frase (o Mestre ignora)
#    Ele remove varios em sequencia: "po cara eu queria que voce abrisse..."
# ---------------------------------------------------------------------
ignorar_no_inicio:
  - "o que eu quero fazer e"
  - "o que eu quero e"
  - "o que eu preciso e"
  - "eu quero que voce"
  - "eu queria que voce"
  - "quero que voce"
  - "queria que voce"
  - "eu preciso que voce"
  - "preciso que voce"
  - "sera que tem como"
  - "tem como voce"
  - "voce tem como"
  - "tem como"
  - "sera que voce consegue"
  - "sera que voce pode"
  - "voce consegue"
  - "voce pode"
  - "voce podia"
  - "voce poderia"
  - "consegue"
  - "pode"
  - "podia"
  - "da pra"
  - "da para"
  - "me faz um favor"
  - "faz um favor"
  - "faz o seguinte"
  - "seguinte"
  - "e ai"
  - "entao"
  - "olha"
  - "escuta"
  - "agora"
  - "rapidinho"
  - "so"
  - "ai"
  - "ah"
  - "eh"
  - "hum"
  - "e"


# ---------------------------------------------------------------------
# 2) ENFEITES EM QUALQUER LUGAR (o Mestre apaga onde aparecerem)
# ---------------------------------------------------------------------
ignorar_em_qualquer_lugar:
  - "por favor"
  - "por gentileza"
  - "pra mim"
  - "para mim"
  - "ai pra mim"
  - "po"
  - "pow"
  - "cara"
  - "mano"
  - "vei"
  - "velho"
  - "tipo"
  - "tipo assim"
  - "ne"
  - "rapidao"
  - "rapidinho"
  - "fazendo favor"


# ---------------------------------------------------------------------
# 3) SINONIMOS
#    A palavra da ESQUERDA e o que o Mestre entende.
#    A lista da direita sao os jeitos que voce pode falar.
#    Pode adicionar a vontade!
# ---------------------------------------------------------------------
sinonimos:

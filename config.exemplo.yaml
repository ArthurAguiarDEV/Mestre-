# ---------------------------------------------------------------------
# 1c) PERSONALIDADE
#    "descricao" e usada pela IA (cerebro) para conversar.
#    "falas" sao sorteadas: o Mestre nao repete sempre a mesma frase.
#    Mude a vontade! Use acentos normalmente aqui (melhora a pronuncia).
# ---------------------------------------------------------------------
personalidade:
  descricao: "Você é {nome}, um assistente sério, eficiente e direto. Sem brincadeiras e sem enrolação. Respostas mínimas e objetivas. Chama o usuário de {apelido}."
  falas:
    inicio: ["Pronto.", "Online.", "{nome} ativo.", "Disponível {apelido}."]
    chamado: ["Sim?", "Diga.", "Ouvindo.", "Pode falar."]
    ok: ["Ok.", "Feito.", "Certo.", "Entendido.", "Pronto."]
    nao_entendi: ["Não entendi. Repita.", "Comando não reconhecido.", "Pode repetir?"]
    pensando: ["Um momento.", "Verificando."]
    cancelado: ["Cancelado.", "Ok. Não farei."]
    erro: ["Erro. Veja o log.", "Falhou. Detalhes no log."]
    obrigado: ["Disponha.", "Ok."]
    despedida: ["Desligando.", "Até mais."]
  estilo: "Sério e direto"


# ---------------------------------------------------------------------
# 2) VOZ (como o Mestre fala)
# ---------------------------------------------------------------------
voz:
  # "edge"    = voz natural da Microsoft, gratis, precisa de internet.
  # "windows" = voz do proprio Windows, funciona sem internet (mais robotica).
  motor: "kokoro"
  # Se a voz escolhida falhar, ele fala com esta (painel > Voz > "Usar como reserva").
  reserva: "edge"
  # Voz inicial. Para OUVIR e escolher, rode "9_escolher_voz.bat"
  # ou fale: "Mestre, apresenta as vozes".
  voz_edge: "en-US-BrianMultilingualNeural"
  # Mais rapido: "+20%"  | Mais devagar: "-10%"
  velocidade: "+50%"
  # Mais grave: "-5Hz" | Mais agudo: "+5Hz"
  tom: "+9Hz"
  # Vozes para "Mestre, muda a voz" (ele vai passando uma por uma).
  # As "Multilingual" sao vozes de outros paises que falam portugues:
  # costumam soar mais naturais e expressivas, com um leve sotaque.
  vozes_favoritas:
    - "pt-BR-AntonioNeural"
    - "pt-BR-FranciscaNeural"
    - "pt-BR-ThalitaMultilingualNeural"
    - "en-US-AndrewMultilingualNeural"
    - "en-US-BrianMultilingualNeural"
    - "en-US-AvaMultilingualNeural"
    - "en-US-EmmaMultilingualNeural"
    - "fr-FR-RemyMultilingualNeural"
    - "it-IT-GiuseppeMultilingualNeural"
    - "pt-PT-DuarteNeural"
  fluida: true
  # Fala em segundo plano: a escuta continua enquanto ele fala (so vale frase que comeca com a palavra)
  fala_em_segundo_plano: true
  # "Assessor, para" corta a fala na hora; "Assessor, abre o Spotify" corta e executa
  interromper_com_palavra: true
  # Resposta longa comeca a tocar na 1a frase enquanto prepara as outras
  frase_a_frase: true
  voz_kokoro: "pm_alex"
  voz_azure: "pt-BR-AntonioNeural"
